<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>Boggle multi — grille partagée</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page">
    <!-- F9W3-STATIC-LAYOUT-LEGACY-CLEANUP : anciens wrappers/titres supprimés, nœuds utiles conservés pour le shell JS. -->
	<h1>Boggle multi — grille partagée</h1>

<div class="game-panel">
		<p id="game-status" class="game-status">En attente de lancement</p>
		<p id="timer" class="timer">03:00</p>
	</div>

	<div class="row">
		<button id="start" disabled>Lancer une grille aléatoire</button>
	</div>

		<ul id="players"></ul>

		<div id="board" class="board"></div>


		<form id="word-form" class="row">
			<input id="word-input" aria-label="Votre mot" placeholder="Votre mot" autocomplete="off" disabled>
			<button id="word-submit" type="submit" disabled>Valider</button>
		</form>

		<p id="word-feedback" class="word-feedback"></p>

		<ul id="found-words" class="found-words"></ul>

		<div id="log" class="log"></div>
</main>

<script type="module" src="/js/main.js"></script>
</body>
</html>
